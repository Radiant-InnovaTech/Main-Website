<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!--
  ============================================================
  RADIANT INNOVATECH — MASTER HTML EMAIL TEMPLATE
  ------------------------------------------------------------
  Built for the same design system as the website
  (defense-grade dark console: #050816 canvas, #3B82F6 accent),
  but using EMAIL-SAFE techniques — NOT the website CSS:

    • Table-based layout (works in Outlook / Windows Mail)
    • Inline styles on every element (Gmail strips <head><style>)
    • MSO conditional comments for Outlook width + button
    • Bulletproof CTA button (VML for Outlook, <a> elsewhere)
    • 600px content width, fluid down to mobile
    • Dark-mode aware via color-scheme meta

  HOW TO USE
    1. Replace every {{TOKEN}} below.
    2. Keep image/link URLs ABSOLUTE (https://…) — email
       clients can't resolve ../assets relative paths.
    3. Always ship the plain-text alternative (see bottom of
       this file) — it drives deliverability and is shown by
       text-only clients.

  WIRING INTO backend/server.js
    The tokens map to your existing entry fields, e.g.
      {{PREHEADER}}    → one-line summary (hidden, inbox preview)
      {{EYEBROW}}      → e.g. 'Waitlist' / 'Security' / 'Account'
      {{HEADLINE}}     → main H1
      {{INTRO}}        → opening paragraph
      {{CTA_LABEL}}    → button text
      {{CTA_URL}}      → button href (absolute)
      detail rows      → ${escHtml(entry.full_name)} etc.
    Build it with a template literal and pass as `html:` to
    sendMail(), alongside a `text:` fallback. Remember escHtml()
    on any user-supplied value.
  ============================================================
-->
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <meta name="color-scheme" content="dark light"/>
  <meta name="supported-color-schemes" content="dark light"/>
  <title>{{SUBJECT}}</title>

  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->

  <!-- Progressive enhancement only; assume it may be stripped. Critical styles are inlined below. -->
  <style>
    /* Client resets */
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
    body { margin:0; padding:0; width:100% !important; height:100% !important; }
    a { color:#6AA2FF; }

    /* Mobile */
    @media only screen and (max-width:600px) {
      .email-container { width:100% !important; }
      .px { padding-left:24px !important; padding-right:24px !important; }
      .stack { display:block !important; width:100% !important; }
      .h1 { font-size:22px !important; }
    }

    /* Dark-mode clients (Apple Mail / iOS) — keep our dark brand, just lock it in */
    @media (prefers-color-scheme: dark) {
      .bg-canvas { background:#050816 !important; }
      .bg-surface { background:#0F1626 !important; }
    }
  </style>
</head>

<!-- bgcolor + inline style both set so the canvas paints everywhere -->
<body class="bg-canvas" style="margin:0; padding:0; background-color:#050816;" bgcolor="#050816">

  <!-- Preheader: shown as inbox preview text, hidden in the body -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#050816; opacity:0;">
    {{PREHEADER}}
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
  </div>

  <!-- Full-width canvas -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#050816" style="background-color:#050816;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <!--[if mso]>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->

        <!-- 600px card -->
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:600px; background-color:#0F1626; border:1px solid rgba(148,163,184,0.12); border-radius:14px; overflow:hidden;">

          <!-- ── HERO / HEADER ───────────────────────────────── -->
          <tr>
            <td class="bg-surface px" style="padding:36px 40px 30px; background:linear-gradient(135deg,#0a1628 0%,#0f1d3d 100%); background-color:#0a1628; border-bottom:1px solid rgba(59,130,246,0.20);">
              <!-- Brand lockup -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:10px;" valign="middle">
                    <img src="https://radiantinnovatech.com/assets/logo.png" width="28" height="28" alt="Radiant InnovaTech"
                         style="display:block; width:28px; height:28px;"/>
                  </td>
                  <td valign="middle"
                      style="font-family:'Courier New',Courier,monospace; font-size:13px; font-weight:700; letter-spacing:0.14em; color:#F1F5FB; text-transform:uppercase;">
                    RADIANT <span style="color:#3B82F6; font-weight:500;">INNOVATECH</span>
                  </td>
                </tr>
              </table>

              <!-- Eyebrow -->
              <div style="font-family:'Courier New',Courier,monospace; font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#6AA2FF; margin:26px 0 10px;">
                {{EYEBROW}}
              </div>

              <!-- Headline -->
              <h1 class="h1" style="margin:0 0 8px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:26px; line-height:1.25; font-weight:800; letter-spacing:-0.02em; color:#F1F5FB;">
                {{HEADLINE}}
              </h1>
              <p style="margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; line-height:1.6; color:#97A2B6;">
                {{SUBHEAD}}
              </p>
            </td>
          </tr>

          <!-- ── BODY ────────────────────────────────────────── -->
          <tr>
            <td class="px" style="padding:32px 40px;">

              <!-- Intro copy -->
              <p style="margin:0 0 22px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.75; color:#C5CDDA;">
                {{INTRO}}
              </p>

              <!-- ── DETAIL CARD (key/value) ───────────────────
                   Table rows, NOT flexbox — renders in Outlook. -->
              <div style="font-family:'Courier New',Courier,monospace; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#6AA2FF; margin:0 0 12px;">
                {{CARD_LABEL}}
              </div>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background-color:rgba(59,130,246,0.06); border:1px solid rgba(59,130,246,0.18); border-radius:10px; margin:0 0 26px;">
                <!-- Repeat this <tr> per field. Drop the border-bottom on the last row. -->
                <tr>
                  <td style="padding:11px 18px; border-bottom:1px solid rgba(148,163,184,0.08); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; color:#5C6678; width:130px;" valign="top">{{KEY}}</td>
                  <td style="padding:11px 18px; border-bottom:1px solid rgba(148,163,184,0.08); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:13px; font-weight:500; color:#F1F5FB; word-break:break-word;" valign="top">{{VALUE}}</td>
                </tr>
                <tr>
                  <td style="padding:11px 18px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; color:#5C6678; width:130px;" valign="top">{{KEY}}</td>
                  <td style="padding:11px 18px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:13px; font-weight:500; color:#F1F5FB; word-break:break-word;" valign="top">{{VALUE}}</td>
                </tr>
              </table>

              <!-- Secondary copy -->
              <p style="margin:0 0 28px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:14px; line-height:1.7; color:#97A2B6;">
                {{BODY_PARAGRAPH}}
              </p>

              <!-- ── BULLETPROOF CTA BUTTON ────────────────────── -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#3B82F6" style="border-radius:10px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                                 href="{{CTA_URL}}" style="height:46px; v-text-anchor:middle; width:260px;" arcsize="22%"
                                 strokecolor="#3B82F6" fillcolor="#3B82F6">
                      <w:anchorlock/>
                      <center style="color:#ffffff; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; font-weight:bold;">{{CTA_LABEL}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-- -->
                    <a href="{{CTA_URL}}" target="_blank"
                       style="display:inline-block; padding:14px 30px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:10px; background-color:#3B82F6;">
                      {{CTA_LABEL}} &rarr;
                    </a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- ── FOOTER ──────────────────────────────────────── -->
          <tr>
            <td class="px" style="padding:22px 40px; border-top:1px solid rgba(148,163,184,0.08); background-color:#0c1322;">
              <p style="margin:0 0 6px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.7; color:#5C6678; text-align:center;">
                Radiant InnovaTech &middot; Accra, Ghana
              </p>
              <p style="margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:1.7; color:#5C6678; text-align:center;">
                <a href="https://radiantinnovatech.com" style="color:#3B82F6; text-decoration:none;">radiantinnovatech.com</a>
                &nbsp;&middot;&nbsp;
                <a href="https://radiantinnovatech.com/pages/contact.html" style="color:#3B82F6; text-decoration:none;">Contact</a>
                &nbsp;&middot;&nbsp;
                <a href="{{UNSUBSCRIBE_URL}}" style="color:#5C6678; text-decoration:underline;">Unsubscribe</a>
              </p>
            </td>
          </tr>

        </table>
        <!--[if mso]></td></tr></table><![endif]-->

      </td>
    </tr>
  </table>

  <!--
    PLAIN-TEXT ALTERNATIVE (ship as the `text:` field, not inside the HTML)
    ----------------------------------------------------------------------
    {{EYEBROW}} — Radiant InnovaTech

    {{HEADLINE}}

    {{INTRO}}

    {{CARD_LABEL}}
    {{KEY}}: {{VALUE}}
    {{KEY}}: {{VALUE}}

    {{BODY_PARAGRAPH}}

    {{CTA_LABEL}}: {{CTA_URL}}

    Radiant InnovaTech · Accra, Ghana
    https://radiantinnovatech.com
    Unsubscribe: {{UNSUBSCRIBE_URL}}
  -->
</body>
</html>
